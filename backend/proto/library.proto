// =============================================================
// Neighborhood Library Service — Protocol Buffer Definition
// This file defines the service contract.  The implementation
// uses a REST/HTTP transport (FastAPI) that mirrors this schema.
// =============================================================

syntax = "proto3";

package library;

import "google/protobuf/timestamp.proto";

option go_package = "./library";

// =============================================================
// SHARED ENUMS
// =============================================================

enum MembershipStatus {
  MEMBERSHIP_STATUS_UNSPECIFIED = 0;
  MEMBERSHIP_STATUS_ACTIVE      = 1;
  MEMBERSHIP_STATUS_SUSPENDED   = 2;
  MEMBERSHIP_STATUS_EXPIRED     = 3;
}

enum LoanStatus {
  LOAN_STATUS_UNSPECIFIED = 0;
  LOAN_STATUS_ACTIVE      = 1;
  LOAN_STATUS_RETURNED    = 2;
  LOAN_STATUS_OVERDUE     = 3;
}

// =============================================================
// BOOK MESSAGES
// =============================================================

message Book {
  string   id              = 1;  // UUID
  string   isbn            = 2;
  string   title           = 3;
  string   author          = 4;
  string   genre           = 5;
  int32    published_year  = 6;
  int32    total_copies    = 7;
  int32    available_copies = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message CreateBookRequest {
  string isbn           = 1;
  string title          = 2;  // required
  string author         = 3;  // required
  string genre          = 4;
  int32  published_year = 5;
  int32  total_copies   = 6;
}

message UpdateBookRequest {
  string id             = 1;  // required — the book to update
  // All other fields are optional; only supplied fields are changed (PATCH semantics)
  string isbn           = 2;
  string title          = 3;
  string author         = 4;
  string genre          = 5;
  int32  published_year = 6;
  int32  total_copies   = 7;
}

message GetBookRequest {
  string id = 1;
}

message ListBooksRequest {
  int32  page      = 1;  // 1-based
  int32  page_size = 2;
  string title     = 3;  // optional partial-match filter
  string author    = 4;  // optional filter
  string genre     = 5;  // optional filter
}

message ListBooksResponse {
  repeated Book books      = 1;
  int32         total      = 2;
  int32         page       = 3;
  int32         page_size  = 4;
}

// =============================================================
// MEMBER MESSAGES
// =============================================================

message Member {
  string            id                = 1;
  string            first_name        = 2;
  string            last_name         = 3;
  string            email             = 4;
  string            phone             = 5;
  string            address           = 6;
  MembershipStatus  membership_status = 7;
  string            membership_date   = 8;  // ISO date string
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message CreateMemberRequest {
  string first_name = 1;  // required
  string last_name  = 2;  // required
  string email      = 3;  // required, unique
  string phone      = 4;
  string address    = 5;
}

message UpdateMemberRequest {
  string           id                = 1;  // required
  // All other fields are optional; only supplied fields are changed (PATCH semantics)
  string           first_name        = 2;
  string           last_name         = 3;
  string           email             = 4;
  string           phone             = 5;
  string           address           = 6;
  MembershipStatus membership_status = 7;
}

message GetMemberRequest {
  string id = 1;
}

message ListMembersRequest {
  int32  page      = 1;
  int32  page_size = 2;
  string search    = 3;  // optional partial match on first_name, last_name, or email
}

message ListMembersResponse {
  repeated Member members   = 1;
  int32           total     = 2;
  int32           page      = 3;
  int32           page_size = 4;
}

// =============================================================
// LOAN MESSAGES
// =============================================================

message Loan {
  string     id          = 1;
  string     book_id     = 2;
  string     member_id   = 3;
  Book       book        = 4;   // embedded for convenience
  Member     member      = 5;   // embedded for convenience
  LoanStatus status      = 6;
  double     fine_amount = 7;
  google.protobuf.Timestamp borrowed_at  = 8;
  google.protobuf.Timestamp due_date     = 9;
  google.protobuf.Timestamp returned_at  = 10;
  google.protobuf.Timestamp created_at   = 11;
  google.protobuf.Timestamp updated_at   = 12;
}

message BorrowBookRequest {
  string book_id   = 1;  // required
  string member_id = 2;  // required
}

message ReturnBookRequest {
  string loan_id = 1;  // required
}

message ListLoansByMemberRequest {
  string member_id = 1;
  bool   active_only = 2;  // if true, return only active and overdue loans (excludes returned)
}

message ListLoansByMemberResponse {
  repeated Loan loans = 1;
  int32           total = 2;
}

message ListOverdueLoansResponse {
  repeated Loan loans = 1;
  int32         total = 2;
}

message ListAllLoansRequest {
  int32 page      = 1;  // 1-based
  int32 page_size = 2;
}

message ListAllLoansResponse {
  repeated Loan loans     = 1;
  int32         total     = 2;
  int32         page      = 3;
  int32         page_size = 4;
}

message EmptyRequest {}

// =============================================================
// SERVICE DEFINITIONS
// =============================================================

service BookService {
  rpc CreateBook  (CreateBookRequest)  returns (Book);
  rpc GetBook     (GetBookRequest)     returns (Book);
  rpc UpdateBook  (UpdateBookRequest)  returns (Book);
  rpc ListBooks   (ListBooksRequest)   returns (ListBooksResponse);
}

service MemberService {
  rpc CreateMember (CreateMemberRequest) returns (Member);
  rpc GetMember    (GetMemberRequest)    returns (Member);
  rpc UpdateMember (UpdateMemberRequest) returns (Member);
  rpc ListMembers  (ListMembersRequest)  returns (ListMembersResponse);
}

service LoanService {
  rpc BorrowBook     (BorrowBookRequest)       returns (Loan);
  rpc ReturnBook     (ReturnBookRequest)        returns (Loan);
  rpc ListAllLoans   (ListAllLoansRequest)      returns (ListAllLoansResponse);
  rpc ListLoansByMember (ListLoansByMemberRequest) returns (ListLoansByMemberResponse);
  rpc ListOverdueLoans  (EmptyRequest)             returns (ListOverdueLoansResponse);
}
